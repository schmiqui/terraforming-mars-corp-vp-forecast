version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount model directory for persistence
      - ./web/model.pkl:/app/web/model.pkl
      # Mount data directories (optional, for development)
      - ./datasets:/app/datasets:ro
      - ./cards:/app/cards:ro
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/model/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

